name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event.deleted != true &&
      (github.repository != 'Sunakier/memos-m' || github.event_name == 'pull_request' ||
        !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') ||
          startsWith(github.ref, 'refs/heads/codex/')))
    permissions:
      contents: read
    uses: ./.github/workflows/distribution.yml
    with:
      channel: check

  preview:
    if: >-
      github.event.deleted != true && github.repository == 'Sunakier/memos-m' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/') ||
        startsWith(github.ref, 'refs/heads/codex/'))
    permissions:
      contents: write
    uses: ./.github/workflows/distribution.yml
    with:
      channel: preview
    secrets: inherit
