name: Nightly API Integration Test

on:
  schedule:
    - cron: "0 0 * * *" # Runs every day at midnight UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 1. Setup Gradle with Enhanced Caching
      # 'setup-gradle' enables read-only caching for dependencies by default.
      # We explicitly allow writing to the cache to ensure build artifacts are saved.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false # Allow the job to write to the cache (important for updating deps)

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Integration Tests
        run: ./gradlew :app:testDebugUnitTest --tests org.example.memosm.api.MemosApiIntegrationTest
