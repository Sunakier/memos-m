name: Android CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@V5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get current timestamp
        id: timestamp
        run: echo "date=$(date +'%Y%m%d_%H%M%S')" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/release.keystore

      - name: Build Release APK
        run: ./gradlew assembleRelease --build-cache --parallel --configuration-cache
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Prepare APK for Upload
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then echo "No signed APK found!"; exit 1; fi
          cp "$APK_FILE" "memos-m-${{ steps.timestamp.outputs.date }}.apk"
          echo "APK_PATH=memos-m-${{ steps.timestamp.outputs.date }}.apk" >> $GITHUB_ENV

      # -------------------------------
      # FORCE-UPDATE TAG
      # -------------------------------
      - name: Update latest tag
        run: |
          git tag -f latest
          git push origin latest --force

      # -------------------------------
      # CREATE / UPDATE RELEASE
      # -------------------------------
      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            **Auto Build – Every Commit**
            Commit: ${{ github.sha }}
            Date: ${{ steps.timestamp.outputs.date }}

            This release is automatically updated on every push to main.
          files: ${{ env.APK_PATH }}
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
