syntax = "proto3";

package google.api;

import "google/protobuf/descriptor.proto";

option java_multiple_files = true;
option java_package = "com.google.api";
option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";

extend google.protobuf.MethodOptions {
  // A job-level default for the maximum number of retry attempts for a
  // RPC method.
  int32 method_signature = 1051;
  // A comma-separated list of field names that should be included in
  // the method's client-side signature.
  repeated string default_host = 1049;
  // A comma-separated list of the scopes that are needed to call
  // the method.
  string oauth_scopes = 1050;
}

extend google.protobuf.ServiceOptions {
  // The hostname for the service, such as `pubsub.googleapis.com`.
  string default_host_service = 1049;
  // A comma-separated list of the scopes that are needed to call
  // the service.
  string oauth_scopes_service = 1050;
}
